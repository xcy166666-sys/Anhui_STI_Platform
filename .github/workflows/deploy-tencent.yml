name: Deploy Anhui Demo to Tencent CVM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy bundle
        run: |
          set -e
          rm -rf deploy_bundle
          mkdir -p deploy_bundle/mewhelp_backend/scripts deploy_bundle/mewhelp_backend/tests/data deploy_bundle/anhui_frontend_dist
          cp Dockerfile.anhui docker-compose.prod.yml deploy_bundle/
          cp -a deploy deploy_bundle/
          npm ci --prefix rag_frontend
          npm run build --prefix rag_frontend
          cp -a rag_frontend/dist/. deploy_bundle/anhui_frontend_dist/
          cp -a mewhelp_backend/app deploy_bundle/mewhelp_backend/
          cp mewhelp_backend/requirements-anhui.txt deploy_bundle/mewhelp_backend/
          cp mewhelp_backend/requirements-observability.txt deploy_bundle/mewhelp_backend/
          cp mewhelp_backend/requirements-ragas.txt deploy_bundle/mewhelp_backend/
          cp mewhelp_backend/scripts/eval_anhui_ragas.py deploy_bundle/mewhelp_backend/scripts/
          cp mewhelp_backend/tests/data/anhui_ragas_eval.jsonl deploy_bundle/mewhelp_backend/tests/data/

      - name: Upload project to Tencent CVM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CVM_PORT }}
          source: "deploy_bundle/*"
          target: "/tmp/anhui-sti-platform-upload"
          strip_components: 1
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CVM_PORT }}
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/anhui-sti-platform"
            fi
            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown "$USER:$USER" "$DEPLOY_PATH"
            for item in /tmp/anhui-sti-platform-upload/* /tmp/anhui-sti-platform-upload/.[!.]*; do
              [ -e "$item" ] || continue
              name="$(basename "$item")"
              case "$name" in
                .git|.env|server-data) continue ;;
              esac
              cp -a "$item" "$DEPLOY_PATH/"
            done
            cd "$DEPLOY_PATH"
            test -f .env
            test -f server-data/anhui_data/cleaned/project_vectors_source.jsonl
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps
            rm -rf /tmp/anhui-sti-platform-upload
