name: Deploy Anhui Demo to Tencent CVM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload project to Tencent CVM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CVM_PORT }}
          source: "."
          target: "/tmp/anhui-sti-platform-upload"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CVM_PORT }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/anhui-sti-platform"
            fi
            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown "$USER:$USER" "$DEPLOY_PATH"
            cp -a /tmp/anhui-sti-platform-upload/. "$DEPLOY_PATH/"
            cd "$DEPLOY_PATH"
            test -f .env
            test -f server-data/anhui_data/cleaned/project_vectors_source.jsonl
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps
            rm -rf /tmp/anhui-sti-platform-upload
