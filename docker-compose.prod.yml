services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: anhui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_center}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rag_center}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:15432:5432"

  anhui-app:
    build:
      context: .
      dockerfile: Dockerfile.anhui
    image: anhui-sti-platform:latest
    container_name: anhui-sti-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag_center}
    volumes:
      - ./server-data/anhui_data:/app/anhui_data
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: anhui-nginx
    restart: unless-stopped
    depends_on:
      anhui-app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
